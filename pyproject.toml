[project]
name = "crypto-trading-framework"
version = "1.0.0"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "arch",
    "pyarrow",
    "ccxt",
    "matplotlib",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

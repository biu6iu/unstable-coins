data:
  symbol: BTC/USDT
  timeframe: 1d
  limit: 730          # ~2 years of daily candles

backtest:
  fee: 0.001            # 0.1% per position change
  slippage_bps: 5        # adverse price impact per position change, in basis points
  min_holding_period: 0  # bars; 0 = off, otherwise suppresses flips faster than this
  initial_capital: 10000

# strategy registry
strategies:
  - name: ma_crossover
    params: {fast: 20, slow: 50}
  - name: rsi_mean_reversion
    params: {window: 14, buy_below: 30, exit_above: 50}
  - name: donchian_breakout
    params: {entry_window: 20, exit_window: 10}
  - name: tsmom
    params: {lookback: 90}
  - name: buy_and_hold
    params: {}

# fast/slow combinations for parameter sweep
sweep:
  fast_options: [10, 20, 30]
  slow_options: [50, 100, 150]

# walk-forward fold sizes (bars)
walk_forward:
  train_size: 365
  test_size: 90
  expanding: false

# monte carlo configs
monte_carlo:
  enabled: false
  n_trials: 2000
  block_length: 20
  noise_std: 0.001

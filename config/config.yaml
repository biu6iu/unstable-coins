data:
  symbol: BTC/USDT
  timeframe: 1d
  limit: 730          # ~2 years of daily candles

backtest:
  fee: 0.001            # 0.1% per position change
  slippage_bps: 5        # adverse price impact per position change, in basis points
  min_holding_period: 0  # bars; 0 = off, otherwise suppresses flips faster than this
  initial_capital: 10000

# strategy registry
strategies:
  - name: ma_crossover
    params: {fast: 20, slow: 50}
  - name: rsi_mean_reversion
    params: {window: 10, buy_below: 20, exit_above: 50}
  - name: donchian_breakout
    params: {entry_window: 20, exit_window: 10}
  - name: tsmom
    params: {lookback: 60}
  - name: rsi_filtered_crossover
    params: {fast: 20, slow: 50, rsi_window: 14, rsi_overbought: 70.0}
  - name: soft_voting_ensemble
    # member_sharpes are the members own walk-forward sharpes in this order: MACrossover, RSIMeanReversion, DonchianBreakout
    params:
      fast: 20
      slow: 50
      rsi_window: 10
      buy_below: 20
      exit_above: 50
      entry_window: 20
      exit_window: 10
      member_sharpes: [-0.9580, -0.6936, -0.2855]
  - name: buy_and_hold
    params: {}


# Candidate parameter values the walk-forward validator chooses between
param_grids:
  ma_crossover:
    fast: [10, 15, 20, 25]
    slow: [40, 50, 75, 100]
  rsi_mean_reversion:
    window: [10, 14, 21]
    buy_below: [20, 25, 30]
    exit_above: [50, 60, 70]
  donchian_breakout:
    entry_window: [15, 20, 30, 40]
    exit_window: [7, 10, 15]
  tsmom:
    lookback: [30, 60, 90, 120]

# fast/slow combinations for parameter sweep
sweep:
  fast_options: [10, 20, 30]
  slow_options: [50, 100, 150]
  min_holding_periods: [0, 2, 3, 5, 7]
  min_holding_strategies: [rsi_filtered_crossover, soft_voting_ensemble, hard_voting_ensemble]

# walk-forward fold sizes (bars)
walk_forward:
  train_size: 365
  test_size: 90
  expanding: false

# monte carlo configs
monte_carlo:
  enabled: true
  n_trials: 2000
  block_length: 20
  noise_std: 0.001

# paper trading 
paper_trading:
  strategy_name: ma_crossover     
  log_path: logs/paper_trades.jsonl
  poll_interval_seconds: null     # null -> derive from data.timeframe
  max_retries: 5
  retry_base_delay_seconds: 2.0
  retry_max_delay_seconds: 60.0
